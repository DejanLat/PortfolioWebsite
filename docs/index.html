rumentation, commercialization planning, and lab-to-product transition.</li></ul></section><section aria-labelledby="selected-work"><h2 id="selected-work">Selected Work</h2><article><h3>PRISM/OMEGA Microscope</h3><p>Optomechanical microscope instrumentation for advanced research workflows, with three-axis coordinated motion, piezo-driven actuation, Python and LabVIEW interfaces, and a modular retrofit-friendly architecture.</p></article><article><h3>AAAS / Science Advances Cover Art Credit</h3><p>Scientific visualization and cover art credit for Science Advances, Vol. 12, Issue 21, accompanying work on probing individual quantum emitters in bulk semiconductors via photonic nanojets.</p></article><article><h3>Photonics North 2026</h3><p>Credited on the accepted Photonics North 2026 poster presentation "Towards Cryogenic Studies of Inverse-Designed Nanostructures in Diamond."</p></article></section><section aria-labelledby="skills"><h2 id="skills">Technical Skills</h2><p>Python, LabVIEW, CAD, Fusion 360, Onshape, Blender, MATLAB, optical design, laser alignment, fiber coupling, optical benches, cryostat integration, manual and CNC machining, electronics assembly, tolerance planning, and inspection thinking.</p></section><section aria-labelledby="studio-link"><h2 id="studio-link">Studio</h2><p><a href="https://axivionstudio.com/">Axivion Studio - Scientific Visualization</a></p></section></main></noscript><div id="root"></div></body></html>
